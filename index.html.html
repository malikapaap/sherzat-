<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>КТО ХОРОШО ЗНАЕТ ШЕРЗАТА?</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--g:#b6ff00;--p:#b026ff;--k:#ff2e93;--b:#2ee6ff;--ink:#f4f0ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#2a0a4a,transparent 50%),radial-gradient(circle at 90% 90%,#0a3a2a,transparent 45%),var(--bg);color:var(--ink);font:800 16px/1.35 Rubik,system-ui,sans-serif;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.14;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
body.shake main{animation:shk .45s}@keyframes shk{20%{transform:translate(-9px,4px) rotate(-1deg)}40%{transform:translate(9px,-5px) rotate(1deg)}60%{transform:translate(-7px,-3px)}80%{transform:translate(6px,5px)}}
h1,h2,h3{font-family:"Rubik Mono One",Rubik,sans-serif;font-weight:400;margin:0;line-height:1.05;text-transform:uppercase}
main{position:relative;z-index:2;max-width:560px;margin:auto;padding:70px 18px 90px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.scr{display:flex;flex-direction:column;gap:18px;animation:in .4s cubic-bezier(.2,1.4,.4,1)}@keyframes in{from{opacity:0;transform:scale(.92) rotate(-1.5deg)}}
.glitch{position:relative;font-size:clamp(30px,10vw,54px);color:var(--g);text-shadow:0 0 24px rgba(182,255,0,.55)}
.glitch:before,.glitch:after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch:before{color:var(--k);transform:translate(3px,0);clip-path:inset(0 0 55% 0);animation:gl 2.4s steps(2) infinite}
.glitch:after{color:var(--b);transform:translate(-3px,0);clip-path:inset(60% 0 0 0);animation:gl 3s steps(2) infinite reverse}
@keyframes gl{0%,88%{opacity:0}90%{opacity:1;transform:translate(6px,-2px)}94%{opacity:1;transform:translate(-5px,2px)}100%{opacity:0}}
.sub{color:#cbb8ff;font-size:18px;margin:0}
.btn{border:3px solid #000;cursor:pointer;padding:18px 22px;font:400 18px "Rubik Mono One",sans-serif;text-transform:uppercase;color:#000;background:var(--g);border-radius:16px;box-shadow:6px 6px 0 var(--k);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:9px 9px 0 var(--k)}.btn:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--k)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.alt{background:var(--b);box-shadow:6px 6px 0 var(--p);font-size:14px;padding:14px 16px;text-decoration:none;display:inline-block}
input{width:100%;padding:18px;border-radius:16px;border:3px solid var(--p);background:rgba(255,255,255,.07);color:var(--ink);font:800 20px Rubik;outline:none;backdrop-filter:blur(10px)}input:focus{border-color:var(--g);box-shadow:0 0 22px rgba(182,255,0,.4)}
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:16px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;font-family:"Rubik Mono One";font-size:14px;color:var(--b)}
.bar{height:14px;border:2px solid var(--g);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--g) 0 10px,var(--k) 10px 20px);transition:width .5s}
.q{font-size:clamp(20px,6vw,27px);font-family:Rubik;font-weight:800;text-transform:none;line-height:1.2}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--ink);font:800 17px Rubik;cursor:pointer;transition:transform .15s,border-color .15s}
.opt b{font-family:"Rubik Mono One";color:var(--p);font-weight:400}
.opt:hover:not(:disabled){transform:scale(1.03) rotate(-.6deg);border-color:var(--g)}.opt:disabled{cursor:default}
.opt.ok{background:rgba(182,255,0,.22);border-color:var(--g);box-shadow:0 0 24px rgba(182,255,0,.5)}.opt.no{background:rgba(255,46,147,.25);border-color:var(--k);text-decoration:line-through}
.react{font:400 19px "Rubik Mono One";text-transform:uppercase;padding:14px 16px;border-radius:14px;background:var(--p);transform:rotate(-1.5deg);animation:in .3s}.react.w{background:var(--k)}.react.r{background:var(--g);color:#000}
.big{font:400 clamp(80px,28vw,140px) "Rubik Mono One";color:var(--g);text-shadow:4px 4px 0 var(--k),-3px -3px 0 var(--b);line-height:1}
.lb{margin:0;padding:0;list-style:none}.lb li{display:flex;gap:8px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.2);align-items:center;flex-wrap:wrap}.lb li:last-child{border:0}.lb .me{color:var(--g)}.lb small{width:100%;color:#a99bd0;font-weight:500}.lb b{flex:1}
.pop{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);transform:translateX(-50%) rotate(-2deg);width:min(88vw,400px);padding:14px 16px;border-radius:16px;background:var(--b);color:#000;font:400 16px "Rubik Mono One";text-transform:uppercase;text-align:center;box-shadow:6px 6px 0 var(--p);animation:in .3s}
.full{position:fixed;inset:0;z-index:70;background:rgba(7,5,13,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding:24px;animation:in .3s}.full .em{font-size:96px}
.corner{position:fixed;z-index:4;font:400 11px "Rubik Mono One";color:var(--k);opacity:0;transition:opacity .6s;max-width:150px;text-transform:uppercase;pointer-events:none}.corner.on{opacity:.85}
#logo{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;font:400 16px "Rubik Mono One";background:var(--g);color:#000;padding:6px 12px;border-radius:10px;transform:rotate(-3deg);cursor:pointer;user-select:none;border:2px solid #000}
.tick{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px));background:var(--k);color:#000;overflow:hidden;white-space:nowrap;font:400 12px "Rubik Mono One";padding:6px 0}.tick span{display:inline-block;animation:mq 22s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.fl{position:fixed;z-index:1;font-size:34px;opacity:.28;animation:fy 7s ease-in-out infinite alternate;pointer-events:none}@keyframes fy{to{transform:translateY(-30px) rotate(20deg)}}
#cf{position:fixed;inset:0;z-index:80;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="logo">ШЕРЗАТ</div><div class="corner" id="cor"></div><canvas id="cf"></canvas>
<main id="app"></main>
<div class="tick"><span id="tk"></span></div>
<script>
/* ===== ДАННЫЕ (всё легко менять) ===== */
const settings={owner:"Шерзата",logoClicks:7,corners:["ШЕРЗАТ СМОТРИТ 👁️","НЕ ГУГЛИ","ПОЗВОНИ ЕМУ, ТРУСИХА","ОН ВСЁ ВИДИТ","ЕМУ ПОХУЙ, НО ОН ЗАПИШЕТ","ГДЕ МОЙ ПЛОВ?","ПОН"],rareMemeChance:.05,popupChance:.22,ticker:"ШЕРЗАТ ⚽ ШЕРЗАТ 🍔 ШЕРЗАТ 🚗 ШЕРЗАТ 💀 ПОН ⚽ ШЕРЗАТ 🍔 ШЕРЗАТ 🚗 ШЕРЗАТ 💀 ПОН "};
/* c — индекс правильного ответа (с 0) */
const questions=[
 {q:"За какую команду Шерзат топит до последнего, даже когда она сливает?",o:["Реал Мадрид","Барселона","Манчестер Сити","За ту, что выигрывает"],c:1},
 {q:"Кто для Шерзата футбольный бог?",o:["Роналду","Неймар","Месси","Дед из соседнего двора"],c:2},
 {q:"Во что Шерзат играет, а потом орёт на геймпад?",o:["GTA","CS","Дота","EA FC (FIFA)"],c:3},
 {q:"Шерзат внезапно получил 1 000 000 сом. Что он сделает?",o:["Потратит всё за неделю","Купит машину","Сначала 3 часа будет думать, куда вложить","Вложит в бизнес"],c:3},
 {q:"Какая машина у Шерзата в мечтах?",o:["Mercedes","Land Cruiser","BMW","Лада Приора"],c:2},
 {q:"Шерзат сказал «щас». Что будет дальше?",o:["Реально сделает сразу","Скажет «щас» и не сделает","Уже бежит","Забыл, что вообще писал"],c:1},
 {q:"Что Шерзат ненавидит до глубины души?",o:["Толпу и очереди","Учёбу","Ранний подъём","Когда пишут «привет» и молчат"],c:2},
 {q:"Любимая еда Шерзата?",o:["Плов","Салат «для здоровья»","Шаурма или бургер","Я не ем, я функционирую"],c:2},
 {q:"Какой у Шерзата характер?",o:["Душа компании","Хаос в человеческом теле","Молчун, пока не узнает человека","Профессиональный токсик"],c:2},
 {q:"Какое слово Шерзат пишет вместо нормальных ответов?",o:["«Пон»","«Окей, дорогая»","«Ага»","«Ладно»"],c:0},
 {q:"Как Шерзат засыпает?",o:["В тишине, как нормальный человек","С включённым видео","Под аудиокнигу про бизнес","Считая овец в EA FC"],c:1},
 {q:"Что Шерзат делает ночью чаще всего?",o:["Играет в EA FC","Ищет, как заработать","Смотрит футбол","Спит. Сюрприз."],c:3},
 {q:"Что доводит Шерзата до психа?",o:["Проигрыш в игре","Когда подвели","Тупые вопросы","Голод"],c:3},
 {q:"Шерзат написал «щас буду». Через сколько он реально появится?",o:["Через 5 минут","Через 20 минут","Через час","Вообще не придёт"],c:1},
 {q:"Вечер. Шерзат может выбрать что угодно. Он выберет:",o:["⚽ Смотреть футбол","🎮 EA FC","🍔 Жрать","💰 Искать новую тему заработка"],c:2}
];
const reactions={
 right:["ЕБАТЬ, ТЫ ЭТО ЗНАЛА?! 💀","ОХУЕТЬ. Засчитано.","Она реально знает Шерзата.","Ладно, +100 к дружбе.","ВОТ ЭТО Я ПОНИМАЮ.","Шерзат сейчас гордится тобой.","КАК ТЫ ЭТО ЗНАЕШЬ, БЛЯТЬ?","Сталкер детектед 👁️","Ну хоть что-то ты знаешь.","Респект. Но не расслабляйся."],
 wrong:["НУ И КАК ТЫ ЭТО ПРОЕБАЛА? 😭","Минус 10 очков дружбы.","Мы точно знакомы?","Бля… это было очевидно.","Шерзат только что потерял к тебе доверие.","ПИЗДЕЦ.","Это надо было умудриться выбрать.","Ты сейчас серьёзно? 💀","ВСЁ, ДРУЖБА ОКОНЧЕНА.","Шерзат сейчас разочарован.","ТЫ ВООБЩЕ КТО, БЛЯТЬ?","КАК ТЫ МОГЛА ЭТО НЕ ЗНАТЬ 😭"]};
const popups=["ШЕРЗАТ ПРОЧИТАЛ И НЕ ОТВЕТИЛ","ЕМУ СЕЙЧАС ИКНУЛОСЬ 💀","ЖДЁМ ПЛОВ 🍚","ПОН.","МЕССИ ОДОБРЯЕТ ⚽","+1 К ПОДОЗРЕНИЯМ","ЩАС БУДУ (НЕТ)"];
const memes=[
 {after:5,title:"СТОП.",text:"Ты сейчас реально отвечала именно так? 💀💀💀 Продолжаем.",btn:"ДАВАЙ УЖЕ НАХУЙ",img:null,emoji:"🤨"},
 {after:10,title:"ПОЛОВИНА ПОЗАДИ",text:"Шерзат следит за каждым твоим ответом. Не облажайся.",btn:"ПОГНАЛИ ДАЛЬШЕ",img:null,emoji:"👁️"}
];
const rareMemes=[{title:"РЕДКИЙ МЕМ",text:"Шанс увидеть это 5%. Шерзат тобой гордится (нет).",emoji:"🗿",img:null}];
const results=[
 {max:0,t:"ЭТО УЖЕ ЛИЧНОЕ",s:"0 правильных. Ты либо саботируешь, либо реально впервые его видишь.",e:"☠️"},
 {max:20,t:"ТЫ ВООБЩЕ КТО?",s:"Шерзат, кажется, впервые тебя видит.",e:"🤡"},
 {max:40,t:"ЗНАКОМЫЙ",s:"Ну… хотя бы имя знаешь.",e:"🫥"},
 {max:60,t:"НУ НОРМ",s:"Иногда даже удивительно.",e:"😐"},
 {max:80,t:"ХОРОШИЙ ДРУГ",s:"Ладно, засчитано.",e:"🤝"},
 {max:99,t:"ТЫ ЧЁ, СТАЛКЕР?",s:"КАКОГО ХУЯ ТЫ ЗНАЕШЬ ЭТО ВСЁ?",e:"👁️"},
 {max:100,t:"ТЫ СЛОМАЛА СИСТЕМУ",s:"БЛЯТЬ. ОНА ЗНАЕТ ШЕРЗАТА ЛУЧШЕ, ЧЕМ ШЕРЗАТ ЗНАЕТ СЕБЯ.",e:"👑"}];
const titles=[{min:100,t:"Главный сталкер Шерзата"},{min:81,t:"Почти родственник"},{min:61,t:"Свой в доску"},{min:41,t:"Знакомый с улицы"},{min:21,t:"Друг друга друга"},{min:0,t:"NPC"}];
const easterEggs={
 logo:{em:"🥚",t:"ТЫ НАШЛА СЕКРЕТ",s:"Никто его не искал, но ты нашла. Шерзат в шоке. Пон."},
 spec:{t:"ТЫ ЭТО СПЕЦИАЛЬНО ДЕЛАЕШЬ?",wrongStreak:3},
 zero:{em:"☠️",t:"0 ИЗ 15.",s:"Даже если тыкать случайно, вышло бы лучше. ЭТО ТАЛАНТ. Шерзат сейчас пишет «Пон» и плачет."}};
const shareText=p=>`Я прошла тест “Кто хорошо знает Шерзата?” и набрала ${p}% 💀\nА ты сколько наберёшь?`;
/* Рейтинг: замени load/add на Firebase/Supabase для общего онлайн-рейтинга */
const leaderboard={key:"sherzat-lb-v1",
 async load(){try{return JSON.parse(localStorage.getItem(this.key)||"[]")}catch(e){return[]}},
 async add(e){const l=await this.load();l.push(e);try{localStorage.setItem(this.key,JSON.stringify(l))}catch(x){}return l}};

/* ===== ЛОГИКА ===== */
const $=s=>document.querySelector(s),app=$("#app"),N=questions.length,pick=a=>a[Math.random()*a.length|0],L="АБВГ";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={name:"",i:0,a:[],ws:0};
const scr=h=>{app.innerHTML=`<div class="scr">${h}</div>`;scrollTo(0,0)};
$("#tk").textContent=settings.ticker.repeat(2);
["⚽","🍔","🚗","💀","🎮"].forEach((e,i)=>{const d=document.createElement("div");d.className="fl";d.textContent=e;d.style.cssText=`left:${8+i*22}%;top:${15+(i*37%70)}%;animation-delay:-${i*1.4}s`;document.body.appendChild(d)});
const cor=$("#cor");setInterval(()=>{cor.textContent=pick(settings.corners);cor.style.cssText=`${Math.random()<.5?"left":"right"}:12px;${Math.random()<.5?"top":"bottom"}:${Math.random()<.5?"110px":"60px"};transform:rotate(${(Math.random()*16-8)|0}deg)`;cor.classList.add("on");setTimeout(()=>cor.classList.remove("on"),2600)},7000);
let pt;function popup(t){document.querySelector(".pop")?.remove();const p=document.createElement("div");p.className="pop";p.textContent=t;document.body.appendChild(p);clearTimeout(pt);pt=setTimeout(()=>p.remove(),2600)}
function full(o,btn="ЗАКРЫТЬ"){const f=document.createElement("div");f.className="full";f.innerHTML=`<div class="em">${o.img?`<img src="${esc(o.img)}" style="max-width:80vw;max-height:40vh" alt="">`:o.em||o.emoji}</div><h2 class="glitch" data-t="${o.t||o.title}">${o.t||o.title}</h2><p class="sub">${o.s||o.text}</p><button class="btn">${btn}</button>`;document.body.appendChild(f);f.querySelector("button").onclick=()=>f.remove()}
const shake=()=>{document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake")};
function confetti(n=200){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const col=["#b6ff00","#ff2e93","#b026ff","#2ee6ff"],P=[...Array(n)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*5,vy:2+Math.random()*5,s:6+Math.random()*8,r:Math.random()*6,c:pick(col)}));let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<300)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
let lc=0,lt;$("#logo").onclick=()=>{clearTimeout(lt);lt=setTimeout(()=>lc=0,1500);if(++lc>=settings.logoClicks){lc=0;shake();confetti(120);full(easterEggs.logo)}};

function intro(){st={name:st.name,i:0,a:[],ws:0};scr(`<h1 class="glitch" data-t="КТО, БЛЯТЬ, ХОРОШО ЗНАЕТ ШЕРЗАТА?">КТО, БЛЯТЬ, ХОРОШО ЗНАЕТ ШЕРЗАТА?</h1><p class="sub">Сейчас узнаем, насколько ты вообще настоящий друг.</p><button class="btn" id="go">ПОГНАЛИ 💀</button><div class="card">${N} вопросов · без шпаргалок · Шерзат следит 👁️</div>`);$("#go").onclick=nameScr}
function nameScr(){scr(`<h2>Как тебя зовут, сталкер?</h2><input id="nm" maxlength="20" placeholder="имя или ник" value="${esc(st.name)}" autocomplete="off"><button class="btn" id="ok">ДАЛЬШЕ →</button>`);$("#ok").onclick=()=>{const v=$("#nm").value.trim();if(!v){shake();popup("ИМЯ ВВЕДИ, АЛЛО");return}st.name=v;quiz()}}
function quiz(){const q=questions[st.i],p=Math.round(st.i/N*100);scr(`<div class="top"><span>ВОПРОС ${st.i+1} / ${N}</span><span>${p}%</span></div><div class="bar"><i id="pb" style="width:${p}%"></i></div><h2 class="q">${q.q}</h2><div id="ops">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}</b>${o}</button>`).join("")}</div><div id="fb"></div>`);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k))}
function answer(k){const q=questions[st.i],ok=k===q.c;st.a[st.i]=k;document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add("ok");else if(j===k)b.classList.add("no")});
 $("#pb").style.width=Math.round((st.i+1)/N*100)+"%";st.ws=ok?0:st.ws+1;
 $("#fb").innerHTML=`<div class="react ${ok?"r":"w"}">${pick(reactions[ok?"right":"wrong"])}</div><button class="btn" id="nx" style="margin-top:14px;width:100%">${st.i===N-1?"РЕЗУЛЬТАТ 💀":"ДАЛЬШЕ →"}</button>`;
 if(ok)confetti(30);else shake();
 if(st.ws===easterEggs.spec.wrongStreak)setTimeout(()=>popup(easterEggs.spec.t),500);
 else if(Math.random()<settings.rareMemeChance)setTimeout(()=>full(pick(rareMemes)),700);
 else if(Math.random()<settings.popupChance)setTimeout(()=>popup(pick(popups)),600);
 $("#nx").onclick=()=>{if(st.i===N-1)return calc();const m=memes.find(m=>m.after===st.i+1);st.i++;m?meme(m):quiz()}}
function meme(m){scr(`<div class="card" style="text-align:center"><div style="font-size:90px">${m.img?`<img src="${esc(m.img)}" style="max-width:100%" alt="">`:m.emoji}</div><h2 class="glitch" data-t="${m.title}">${m.title}</h2><p class="sub" style="margin-top:12px">${m.text}</p></div><button class="btn" id="mn">${m.btn}</button>`);$("#mn").onclick=quiz}
function calc(){const ph=["СЧИТАЕМ ДРУЖБУ…","ПРОВЕРЯЕМ, НЕ СТАЛКЕР ЛИ ТЫ…","СПРАШИВАЕМ У ШЕРЗАТА…","ВЫНОСИМ ПРИГОВОР 💀"];let k=0;scr(`<h2 id="ld" style="text-align:center;margin-top:40px">${ph[0]}</h2>`);const iv=setInterval(()=>{if(++k>=ph.length){clearInterval(iv);result()}else{$("#ld").textContent=ph[k];shake()}},800)}
async function result(){
 const right=st.a.filter((a,i)=>a===questions[i].c).length,pct=Math.round(right/N*100),lv=results.find(r=>pct<=r.max),ti=titles.find(t=>pct>=t.min).t,pts=right*100-(N-right)*10;
 const all=await leaderboard.add({name:st.name,right,total:N,pct,title:ti,d:new Date().toLocaleDateString("ru-RU"),t:Date.now()}),me=all[all.length-1],sorted=[...all].sort((a,b)=>b.right-a.right||a.t-b.t).slice(0,10);
 const miss=questions.map((q,i)=>({q,i})).filter(x=>st.a[x.i]!==x.q.c),med=["🥇","🥈","🥉"];
 scr(`<div style="text-align:center"><p class="sub">${esc(st.name)}, ты знаешь Шерзата на</p><div class="big"><span id="cnt">0</span>%</div><p class="sub">${right} / ${N} правильных</p></div>
 <div class="card" style="text-align:center"><h2 class="glitch" data-t="${lv.e} ${lv.t}">${lv.e} ${lv.t}</h2><p class="sub" style="margin-top:10px">${lv.s}</p></div>
 <div class="card"><h3 style="font-size:16px;margin-bottom:8px">ПОДРОБНЫЙ АНАЛИЗ</h3><p style="margin:0 0 6px">Очков дружбы: <span style="color:${pts<0?"var(--k)":"var(--g)"}">${pts>0?"+":""}${pts}</span></p><p style="margin:0 0 6px">Твой титул: ${ti}</p>${miss.length?`<p style="margin:10px 0 4px;color:var(--k)">ТЫ ПРОЕБАЛА:</p>`+miss.map(x=>`<p style="margin:0 0 8px;font-weight:500">${x.i+1}. ${x.q.q}<br><span style="color:var(--g)">→ ${x.q.o[x.q.c]}</span></p>`).join(""):`<p style="color:var(--g)">ПРОЕБОВ НОЛЬ. ЭТО ПУГАЕТ.</p>`}</div>
 <div class="card"><h3 style="font-size:16px;margin-bottom:6px">РЕЙТИНГ ЛЕГЕНД</h3><ol class="lb">${sorted.map((e,i)=>`<li class="${e.t===me.t?"me":""}"><span>${med[i]||i+1+"."}</span><b>${esc(e.name)}</b><span>${e.pct}% (${e.right}/${e.total})</span><small>${e.title} · ${e.d}</small></li>`).join("")}</ol></div>
 <h3 style="font-size:16px">ПОКАЖИ ШЕРЗАТУ, НАСКОЛЬКО ТЫ ЕГО ЗНАЕШЬ</h3>
 <div style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn alt" id="tg" target="_blank" rel="noopener">Telegram</a><a class="btn alt" id="wa" target="_blank" rel="noopener">WhatsApp</a><button class="btn alt" id="cp">Скопировать</button><button class="btn alt" id="sh">Поделиться</button></div>
 <button class="btn" id="rt">ЕЩЁ РАЗ, Я ОТЫГРАЮСЬ</button>`);
 const cn=$("#cnt"),t0=performance.now();(function f(t){const p=Math.min((t-t0)/1500,1);cn.textContent=Math.round(pct*p);if(p<1)requestAnimationFrame(f)})(t0);
 if(pct===100){confetti(400);full({em:"😂🔥👑",t:"ТЫ СЛОМАЛА СИСТЕМУ",s:lv.s})}else if(pct>=81)confetti(250);else if(right===0){shake();full(easterEggs.zero)}
 const txt=shareText(pct),url=location.href.split("#")[0];
 $("#tg").href=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(txt)}`;$("#wa").href=`https://wa.me/?text=${encodeURIComponent(txt+" "+url)}`;

 $("#sh").onclick=async()=>{if(navigator.share){try{await navigator.share({title:document.title,text:txt,url})}catch(e){}}else{try{await navigator.clipboard.writeText(txt+" "+url)}catch(e){}popup("СКОПИРОВАНО ✅")}};
 $("#rt").onclick=intro}
intro();
